name: goTogetherApp

services:
  postgres:
    image: postgres:16
    container_name: goTogetherApp-postgres
    environment:
      POSTGRES_DB: goTogetherDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - goTogetherApp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d goTogetherDb"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  goTogetherApp_postgres_data:
